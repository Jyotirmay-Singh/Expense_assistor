{% extends "base.html" %}

{% block title %}Sign in — FinCheck{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container" data-aos="fade-up" data-aos-duration="600">

        <div class="auth-header">
            <i data-lucide="log-in" class="auth-header-icon"></i>
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">Sign in to your FinCheck account</p>
        </div>

        <div class="auth-card">
            <form method="POST" action="{{ url_for('login') }}" novalidate
                  x-data="{ loading: false }"
                  @submit="loading = true">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           class="form-input"
                           placeholder="you@example.com"
                           value="{{ email or '' }}"
                           required autofocus>
                </div>

                <div class="form-group" x-data="{ show: false }">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <input :type="show ? 'text' : 'password'"
                               id="password" name="password"
                               class="form-input"
                               placeholder="Your password"
                               required>
                        <button type="button" class="input-eye"
                                @click="show = !show"
                                :aria-label="show ? 'Hide password' : 'Show password'"
                                tabindex="-1">
                            <svg x-show="!show" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg x-show="show" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                        </button>
                    </div>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="remember_me" name="remember_me" value="on"
                           {% if remember_me %}checked{% endif %}>
                    <label for="remember_me" class="form-checkbox-label">
                        Remember me for 30 days
                    </label>
                </div>

                <button type="submit" class="btn-submit" :disabled="loading">
                    <span x-show="!loading">Sign in</span>
                    <span x-show="loading" class="btn-loading">
                        <i data-lucide="loader-circle" class="icon-spin"></i>
                        Signing in…
                    </span>
                </button>
            </form>
        </div>

        <p class="auth-switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one free</a>
        </p>

    </div>
</section>

{% endblock %}
