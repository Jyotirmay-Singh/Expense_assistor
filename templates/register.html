{% extends "base.html" %}

{% block title %}Create account — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container" data-aos="fade-up" data-aos-duration="600">

        <div class="auth-header">
            <i data-lucide="user-plus" class="auth-header-icon"></i>
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-subtitle">Start tracking your expenses today</p>
        </div>

        <div class="auth-card">
            <form method="POST" action="{{ url_for('register') }}" novalidate
                  x-data="{ loading: false, accepted: {{ (accepted or false) | tojson }} }"
                  @submit="loading = true">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name"
                           class="form-input"
                           placeholder="Your name"
                           value="{{ name or '' }}"
                           required autofocus>
                </div>

                <div class="form-group">
                    <label for="display_name">Display name</label>
                    <input type="text" id="display_name" name="display_name"
                           class="form-input"
                           placeholder="What should we call you?"
                           value="{{ display_name or '' }}"
                           maxlength="60" required autocomplete="nickname">
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           class="form-input"
                           placeholder="you@example.com"
                           value="{{ email or '' }}"
                           required>
                </div>

                <div class="form-group">
                    <label for="default_currency">Default currency</label>
                    <select id="default_currency" name="default_currency"
                            class="form-select" required>
                        {% for code in currencies %}
                        <option value="{{ code }}"
                                {% if (default_currency or 'INR') == code %}selected{% endif %}>
                            {{ code }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group" x-data="{ show: false }">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <input :type="show ? 'text' : 'password'"
                               id="password" name="password"
                               class="form-input"
                               placeholder="Min. 8 characters"
                               required>
                        <button type="button" class="input-eye"
                                @click="show = !show"
                                :aria-label="show ? 'Hide password' : 'Show password'"
                                tabindex="-1">
                            <svg x-show="!show" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg x-show="show" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                        </button>
                    </div>
                    <p class="form-hint">At least 8 characters</p>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="accept_terms" name="accept_terms" value="on"
                           x-model="accepted" required
                           {% if accepted %}checked{% endif %}>
                    <label for="accept_terms" class="form-checkbox-label">
                        I agree to the <a href="{{ url_for('terms') }}">Terms of Service</a>
                        and <a href="{{ url_for('privacy') }}">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit" class="btn-submit" :disabled="loading || !accepted">
                    <span x-show="!loading">Create account</span>
                    <span x-show="loading" class="btn-loading">
                        <i data-lucide="loader-circle" class="icon-spin"></i>
                        Creating account…
                    </span>
                </button>
            </form>
        </div>

        <p class="auth-switch">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>

    </div>
</section>

{% endblock %}
